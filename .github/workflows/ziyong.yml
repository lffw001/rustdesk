# RustDesk 1.5.1 + 设备详情补丁：Windows x64 云端构建（纯网页操作，不用本地 git，不用建分支）
# 用法：
#  1. 在 GitHub 网页上 fork rustdesk/rustdesk
#  2. 在你 fork 的默认分支（master）上 Add file → Upload files，
#     把 4 个 .patch 文件传到仓库根目录，直接 commit
#  3. 同样方式把本文件传到 .github/workflows/ 目录，直接 commit
#  4. 到你 fork 的 Actions 页找到 "Build Windows x64 (DeviceInfo)"，
#     点 Run workflow（分支选默认分支即可）
#  5. 等 1~2 小时，在该次运行的 Artifacts 里下载 rustdesk-deviceinfo-windows-x64
# 原理：workflow 自己 checkout 1.5.1 的 tag，再从默认分支取出 patch 文件打上，然后构建。
#
# 版本号全部对照 1.5.1 官方 CI 钉死（flutter-build.yml / bridge.yml）。
# 免费账号每月 2000 分钟 Actions 额度，Windows 按 2 倍扣，一次构建约 200~400 分钟。

name: Build Windows x64 (DeviceInfo)

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout 1.5.1 tag
        uses: actions/checkout@v4
        with:
          ref: 1.5.1
          submodules: recursive

      - name: Apply DeviceInfo patches (patch 文件在 fork 默认分支根目录)
        shell: bash
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}" --depth 1
          for p in 0001-proto-peerinfo-system-info.patch \
                   0002-rust-controlled-report.patch \
                   0003-flutter-device-info-dialog.patch \
                   0004-lang-device-info-keys.patch; do
            git show "FETCH_HEAD:$p" | git apply -
          done
          git status --short | head -20

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-deviceinfo

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter precache
        run: flutter precache --windows

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Generate Flutter bridge code
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Build
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-deviceinfo-windows-x64
          path: rustdesk-dist
